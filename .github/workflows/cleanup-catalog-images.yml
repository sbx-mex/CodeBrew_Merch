name: Limpiar imágenes del catálogo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebrew-catalog-image-reset
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Borrar imágenes y referencias del catálogo
        run: python scripts/cleanup_catalog_images.py --apply

      - name: Publicar limpieza
        run: |
          if git diff --quiet -- data/merch-catalog.js data/merch-catalog-report.json assets/catalog; then
            echo "El catálogo ya está limpio."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/merch-catalog.js data/merch-catalog-report.json
          git add --all assets/catalog/images assets/catalog/featured || true
          git commit -m "Limpiar imágenes del catálogo"
          git pull --rebase origin main
          git push
