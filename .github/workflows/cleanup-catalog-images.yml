name: Auditar capacidad de imágenes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebrew-catalog-image-reset
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar cuatro carpetas sin borrar fotos
        run: python scripts/integrate_uploaded_images.py --help

      - name: Confirmar política
        run: echo "Las fotos manuales son persistentes. Este flujo no elimina imágenes."
