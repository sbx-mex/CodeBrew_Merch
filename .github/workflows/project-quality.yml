name: Calidad del proyecto

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebrew-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias validadas
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Verificar formato y archivos temporales
        run: |
          git diff --check
          test -z "$(find . -type f -not -path './.git/*' \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Auditar sin modificar
        run: |
          python scripts/cleanup_obsolete.py --report "$RUNNER_TEMP/cleanup-report.json"
          python scripts/audit_project.py --output "$RUNNER_TEMP/audit-report.json" --js-output "$RUNNER_TEMP/app-audit.js"

      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Resumen de calidad
        if: always()
        run: |
          echo "## Compuerta de calidad CodeBrew" >> "$GITHUB_STEP_SUMMARY"
          test ! -f "$RUNNER_TEMP/audit-report.json" || cat "$RUNNER_TEMP/audit-report.json" >> "$GITHUB_STEP_SUMMARY"
          test ! -f "$RUNNER_TEMP/cleanup-report.json" || cat "$RUNNER_TEMP/cleanup-report.json" >> "$GITHUB_STEP_SUMMARY"
