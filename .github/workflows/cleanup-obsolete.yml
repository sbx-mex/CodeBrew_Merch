name: Auditar y limpiar obsoletos

on:
  push:
    branches: [main]
    paths:
      - products.js
      - icon-512.png
      - scripts/cleanup_obsolete.py
      - scripts/audit_project.py
      - .github/workflows/cleanup-obsolete.yml
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Eliminar únicamente candidatos seguros no referenciados"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codebrew-cleanup
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validar proyecto antes de limpiar
        run: python scripts/audit_project.py --output "$RUNNER_TEMP/audit-before.json" --js-output "$RUNNER_TEMP/audit-before.js"
      - name: Auditar sin borrar
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.aplicar }}
        run: python scripts/cleanup_obsolete.py --report "$RUNNER_TEMP/cleanup-report.json"
      - name: Eliminar sólo candidatos validados
        if: ${{ github.event_name == 'push' || inputs.aplicar }}
        run: python scripts/cleanup_obsolete.py --apply --report "$RUNNER_TEMP/cleanup-report.json"
      - name: Validar proyecto después de limpiar
        if: ${{ github.event_name == 'push' || inputs.aplicar }}
        run: python scripts/audit_project.py --output "$RUNNER_TEMP/audit-after.json" --js-output "$RUNNER_TEMP/audit-after.js"
      - name: Mostrar resultado
        run: cat "$RUNNER_TEMP/cleanup-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar limpieza
        if: ${{ github.event_name == 'push' || inputs.aplicar }}
        run: |
          if git diff --quiet; then
            echo "No hay archivos seguros por eliminar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Eliminar archivos obsoletos validados"
          git push
