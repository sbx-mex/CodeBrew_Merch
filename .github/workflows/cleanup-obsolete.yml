name: Auditar y limpiar obsoletos

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Eliminar únicamente candidatos seguros no referenciados"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codebrew-maintenance
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias validadas
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Reconstruir datos antes de limpiar
        run: python scripts/build_all.py

      - name: Probar funcionamiento antes de limpiar
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Auditar candidatos sin borrar
        run: python scripts/cleanup_obsolete.py --report "$RUNNER_TEMP/cleanup-report.json"

      - name: Eliminar sólo candidatos validados
        if: ${{ inputs.aplicar }}
        run: python scripts/cleanup_obsolete.py --apply --report "$RUNNER_TEMP/cleanup-report.json"

      - name: Validar proyecto limpio
        if: ${{ inputs.aplicar }}
        run: |
          git diff --check
          python scripts/audit_project.py --output "$RUNNER_TEMP/audit-after.json" --js-output "$RUNNER_TEMP/audit-after.js"
          python -m unittest discover -s tests -p "test_*.py"
          test -z "$(find . -type f -not -path './.git/*' \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Mostrar resultado
        run: cat "$RUNNER_TEMP/cleanup-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar limpieza
        if: ${{ inputs.aplicar }}
        run: |
          if git diff --quiet; then
            echo "No hay archivos seguros por eliminar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Eliminar archivos obsoletos validados"
          if ! git push origin HEAD:main; then
            echo "main cambió; se repite la limpieza segura sobre el último commit."
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_all.py
            python scripts/cleanup_obsolete.py --apply --report "$RUNNER_TEMP/cleanup-retry.json"
            python -m unittest discover -s tests -p "test_*.py"
            python scripts/audit_project.py
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Eliminar archivos obsoletos validados"
            git push origin HEAD:main
          fi
