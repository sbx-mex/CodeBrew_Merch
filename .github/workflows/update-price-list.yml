name: Actualizar lista de precios

on:
  push:
    branches: [main]
    paths:
      - Lista_Precios_Base.xlsx
      - engines/merch-lists/**
      - scripts/generate_products.py
      - scripts/generate_visual_catalog.py
      - scripts/build_woe_pdf_config.py
      - scripts/build_stock_config.py
      - scripts/build_ui_config.py
      - scripts/audit_project.py
      - scripts/build_all.py
      - scripts/requirements.txt
      - index.html
      - app.js
      - styles.css
      - catalog.css
      - sw.js
      - manifest.webmanifest
      - .github/workflows/update-price-list.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebrew-maintenance
  cancel-in-progress: false

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar lector de Excel
        run: pip install --requirement scripts/requirements.txt

      - name: Construir y auditar motores
        run: python scripts/build_all.py

      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Publicar datos validados
        run: |
          if git diff --quiet -- data/products.js data/woe.js data/import-report.json data/merch-catalog.js data/merch-catalog-report.json data/woe-pdf-config.js data/stock-config.js data/ui-config.js data/app-audit.json data/app-audit.js assets/catalog/atlases; then
            echo "La lista ya está actualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.js data/woe.js data/import-report.json data/merch-catalog.js data/merch-catalog-report.json data/woe-pdf-config.js data/stock-config.js data/ui-config.js data/app-audit.json data/app-audit.js assets/catalog/atlases
          git commit -m "Actualizar motores y catálogo visual"
          git pull --rebase origin main
          git push
