name: Actualizar lista de precios

on:
  push:
    branches: [main]
    paths:
      - Lista_Precios_Base.xlsx
      - scripts/generate_products.py
      - scripts/build_woe_pdf_config.py
      - scripts/requirements.txt
      - .github/workflows/update-price-list.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebrew-price-list
  cancel-in-progress: false

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar lector de Excel
        run: pip install --requirement scripts/requirements.txt

      - name: Validar Excel y generar datos
        run: |
          python scripts/generate_products.py
          python scripts/build_woe_pdf_config.py

      - name: Publicar datos validados
        run: |
          if git diff --quiet -- data/products.js data/woe.js data/import-report.json data/woe-pdf-config.js; then
            echo "La lista ya está actualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.js data/woe.js data/import-report.json data/woe-pdf-config.js
          git commit -m "Actualizar datos desde Lista_Precios_Base.xlsx"
          git push
