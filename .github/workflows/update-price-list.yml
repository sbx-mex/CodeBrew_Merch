name: Actualizar lista de precios

on:
  push:
    branches: [main]
    paths:
      - Lista_Precios_Base.xlsx
      - engines/**
      - scripts/**
      - tests/**
      - index.html
      - app.js
      - styles.css
      - catalog.css
      - sw.js
      - manifest.webmanifest
      - assets/catalog/catalog-hero.webp
      - assets/catalog/images/**
      - data/merch-active-products.json
      - .github/workflows/update-price-list.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebrew-maintenance
  cancel-in-progress: false

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias validadas
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Validar recursos estáticos
        run: test -f assets/catalog/catalog-hero.webp

      - name: Construir y auditar motores
        run: python scripts/build_all.py

      - name: Auditar estado publicado
        run: python scripts/audit_project.py

      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Publicar datos validados
        run: |
          if git diff --quiet -- data assets/catalog Control_Fotos_CodeBrew.xlsx; then
            echo "La lista y el catálogo ya están actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git add --all assets/catalog
          git add Control_Fotos_CodeBrew.xlsx
          git commit -m "Actualizar motores y catálogo visual"
          git pull --rebase origin main
          git push
