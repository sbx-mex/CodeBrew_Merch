name: Actualizar lista de precios

on:
  push:
    branches: [main]
    paths:
      - Lista_Precios_Base.xlsx
      - engines/**
      - scripts/**
      - tests/**
      - index.html
      - app.js
      - styles.css
      - catalog.css
      - sw.js
      - manifest.webmanifest
      - assets/catalog/catalog-hero.webp
      - assets/catalog/images/**
      - data/merch-active-products.json
      - .github/workflows/update-price-list.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: codebrew-maintenance
  cancel-in-progress: false

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias validadas
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Validar recursos estáticos
        run: test -f assets/catalog/catalog-hero.webp

      - name: Reconstruir desde Excel, validar SKU POS y auditar
        run: |
          python scripts/build_all.py
          python scripts/validate_pos_excel.py --report "$RUNNER_TEMP/pos-excel-validation.json"
          git diff --check

      - name: Eliminar obsoletos y duplicados validados
        run: python scripts/cleanup_obsolete.py --apply --report "$RUNNER_TEMP/cleanup-report.json"

      - name: Auditar estado publicado
        run: |
          python scripts/audit_project.py
          test -z "$(find . -type f -not -path './.git/*' \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Publicar datos validados
        run: |
          if git diff --quiet; then
            echo "La lista y el catálogo ya están actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Actualizar motores y catálogo visual"
          git pull --rebase origin main
          git push

      - name: Solicitar publicación de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/pages/builds"
